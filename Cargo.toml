[workspace]
members = ["cli/nil", "crates/nil-hir", "crates/nil-compiler", "crates/nil-llvm", "tools/nil-fuzz"]
exclude = ["benchmarks"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
