name: CI
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  NIL_CLANG: clang-18
jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install LLVM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18
          clang-18 --version
      - name: Install pinned Rust with rustfmt and Clippy
        run: rustup show active-toolchain
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}-debug-${{ github.sha }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}-debug-
      - name: Format
        run: ./scripts/ci.sh format
      - name: Clippy
        run: ./scripts/ci.sh clippy
      - name: Build all targets
        run: ./scripts/ci.sh build
      - name: Unit, integration, compile-fail, HIR validation and golden tests
        run: ./scripts/ci.sh test
  release:
    name: release
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install LLVM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18
          clang-18 --version
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - name: Release build, full suite and example execution
        run: ./scripts/ci.sh release
  benchmarks:
    name: benchmark smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: true
          persist-credentials: false
      - name: Install LLVM toolchain
        run: sudo apt-get update && sudo apt-get install -y clang-18
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - name: Benchmark contributor smoke checks (no models or downloads)
        env:
          NIL_BENCH_HOME: ${{ runner.temp }}/nil-benchmarks
        run: |
          python3 -m unittest discover -s benchmarks/tests -v
          ./scripts/bench.sh token --smoke
          ./scripts/bench.sh runtime --smoke
          ./scripts/bench.sh generation --mock
      - name: Archive benchmark smoke artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nil-benchmarks/runs
          if-no-files-found: ignore
          retention-days: 14
