name: Rust checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, '1.85.0']
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal
      - name: Test
        run: cargo +${{ matrix.rust }} test --workspace --locked --offline
      - name: Release semantics
        run: cargo +${{ matrix.rust }} test --workspace --release --locked --offline
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --workspace --all-targets --locked --offline -- -D warnings
