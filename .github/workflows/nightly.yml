name: Nightly
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
# Scheduled runs use the default branch. Manual runs may select another ref.
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  NIL_CLANG: clang-18
jobs:
  extended:
    name: extended
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NIL_BENCH_HOME: ${{ runner.temp }}/nil-nightly-benchmarks
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          submodules: true
      - name: Install LLVM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - name: Mandatory PR checks
        run: ./scripts/ci.sh
      - name: Release suite and all examples
        run: ./scripts/ci.sh release
      - name: Native application ASan and UBSan
        run: ./scripts/sanitize.sh
      - name: Expr-v5 differential application campaign
        run: ./scripts/fuzz-v5.sh --cases 152 --seed 5130572 --out fuzz/artifacts/expr-v5 | tee fuzz/v5-summary.log
      - name: Extended expr-v3 fuzz campaign
        run: ./scripts/fuzz.sh --cases 20000 --native 64 --seed 5130572 --out fuzz/artifacts | tee fuzz/artifacts-summary.log
      - name: Preserve fuzz report and reproducer
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: expr-v3-fuzz-${{ github.sha }}
          path: |
            fuzz/artifacts/
            fuzz/artifacts-summary.log
            fuzz/v5-summary.log
          if-no-files-found: warn
          retention-days: 14
      - name: Record benchmark environment
        run: |
          mkdir -p "$NIL_BENCH_HOME"
          rustc -Vv > "$NIL_BENCH_HOME/environment.txt"
          cargo -V >> "$NIL_BENCH_HOME/environment.txt"
          git rev-parse HEAD >> "$NIL_BENCH_HOME/environment.txt"
          git -C benchmarks rev-parse HEAD >> "$NIL_BENCH_HOME/environment.txt"
          uname -a >> "$NIL_BENCH_HOME/environment.txt"
          lscpu >> "$NIL_BENCH_HOME/environment.txt"
      - name: Compiler performance (informational, no regression threshold)
        id: benchmark
        continue-on-error: true
        run: |
          ./scripts/bench.sh pipeline --full --output "$NIL_BENCH_HOME/runs/pipeline" > "$NIL_BENCH_HOME/pipeline.log" 2>&1
      - name: Report benchmark status
        if: always()
        run: echo 'Performance benchmark outcome — ${{ steps.benchmark.outcome }}. Timings are informational; see artifacts.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: compiler-performance-${{ github.sha }}
          path: ${{ env.NIL_BENCH_HOME }}/
          if-no-files-found: warn
          retention-days: 14
      # Dedicated benchmark CI runs token/runtime/generation smoke checks.
      # Nightly pipeline timings remain informational, not a regression gate.
  msrv:
    name: msrv
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: '1.85.0'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install LLVM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.85.0 --profile minimal
      - run: ./scripts/ci.sh build
      - run: ./scripts/ci.sh test
